name: Create Pull Request to my-neovim-pluginlist

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  create_pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yutkat
          repositories: my-neovim-pluginlist

      - name: Install required system dependencies
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run RSS fetch script
        run: uv run scripts/fetch_rss.py data/latest_rss.json

      - name: Check RSS data
        run: cat data/latest_rss.json

      - name: Find correct category
        run: jq -r 'map(.title = "https://github.com/" + .title) | .[].title' data/latest_rss.json | xargs -i uv run scripts/search.py {} | tee data/search.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR doc
        run: cat data/search.json | uv run scripts/predict_category.py | tee data/pr.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Checkout my-neovim-pluginlist
        uses: actions/checkout@v4
        with:
          repository: yutkat/my-neovim-pluginlist
          path: data/my-neovim-pluginlist
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Insert New plugin
        run: cat data/pr.md | ./scripts/edit_pluginlist.sh

      - name: Update table style
        run: |
          {
            echo "|URL|Category|Reason|"
            echo "|---|---|---|"
            cat data/pr.md
          } | tee data/pr-with-header.md

      - name: Create Pull Request on my-neovim-pluginlist
        run: |
          cd data/my-neovim-pluginlist
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/yutkat/my-neovim-pluginlist.git
          git checkout -b ai-${{ github.run_id }}
          git add .
          git commit -m "Add" || echo "No changes to commit"
          git push origin ai-${{ github.run_id }}
          gh pr create \
            --title "Add" \
            --body-file "../../data/pr-with-header.md" \
            --base main \
            --head ai-${{ github.run_id }} \
            --label "automated pr,bot"
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Upload PR data for verification
        uses: actions/upload-artifact@v4
        with:
          name: pr-data
          path: data/pr-with-header.md

  verify_categories:
    needs: create_pr
    uses: ./.github/workflows/verify-categories.yml
    with:
      branch_name: ai-${{ github.run_id }}
    secrets: inherit
