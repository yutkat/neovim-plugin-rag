name: Verify Categories with Codex

on:
  workflow_call:
    inputs:
      branch_name:
        description: 'Branch name of the PR to verify'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name of the PR to verify'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Setup Codex authentication
        run: |
          mkdir -p ~/.codex
          echo '${{ secrets.CODEX_AUTH }}' > ~/.codex/auth.json

      - name: Checkout my-neovim-pluginlist
        uses: actions/checkout@v4
        with:
          repository: yutkat/my-neovim-pluginlist
          path: data/my-neovim-pluginlist
          ref: ${{ inputs.branch_name }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find and verify PR by branch
        run: |
          echo "Finding PR for branch: ${{ inputs.branch_name }}"
          PR_URL=$(gh pr list --repo yutkat/my-neovim-pluginlist --head "${{ inputs.branch_name }}" --state open --limit 1 --json url --jq '.[0].url')

          if [ -n "$PR_URL" ]; then
            echo "Found PR: $PR_URL"
            cd data/my-neovim-pluginlist
            gh pr view --json body "${{ inputs.branch_name }}" | jq -r .body > .pr-with-header.md

            codex --ask-for-approval never --sandbox danger-full-access -m gpt-5 exec "
              Please analyze the markdown file (`[a-z]*.md`) in the current directory.
              This file contains Neovim plugins with their categories that were automatically added.

              Tasks:
              1. Verify if the plugin categorizations in the `[a-z]*.md` are accurate. Run `cat .pr-with-header.md` and `git diff` to check the current status.
              2. Examine each plugin and their assigned categories.
              3. For each plugin, confirm if the category is appropriate.
              4. If changes are necessary, please update the `[a-z]*.md` file directly.
              5. Update the table with correct categories and provide clear reasons.
              6. Please save the selection reasons in the same format as `.pr-with-header.md` as `.pr-with-header2.md`.

              IMPORTANT:
              - Do not ask for confirmation. This task is running on CI.
              - If you cannot specify a category, keep it as is.

              Output:
              - UPDATE: `[a-z]*.md`
              - WROTE: `.pr-with-header2.md`

              Please make the necessary edits to improve categorization accuracy.
            "
            ls -la
            cd ../..
          else
            echo "No PR found for branch: ${{ inputs.branch_name }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Check if .pr-with-header2.md exists
        run: |
          if [ ! -f "data/my-neovim-pluginlist/.pr-with-header2.md" ]; then
            echo "data/my-neovim-pluginlist/.pr-with-header2.md does not exist. Processing completed."
            exit 1
          fi

      - name: Update Pull Request on my-neovim-pluginlist
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          path: data/my-neovim-pluginlist
          commit-message: "Add"
          committer: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          author: GitHub Actions <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          branch: ${{ inputs.branch_name }}
          delete-branch: true
          base: main
          title: "Add"
          body-path: "data/my-neovim-pluginlist/.pr-with-header2.md"
          labels: "automated pr, bot"