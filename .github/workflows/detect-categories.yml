name: Create PR with Codex

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub App token (yutkat/my-neovim-pluginlist)
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: yutkat
          repositories: my-neovim-pluginlist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install required system dependencies
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Cache Codex workspace
        uses: actions/cache@v4
        with:
          path: |
            $HOME/.codex
            !$HOME/.codex/auth.json
          key: codex-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            codex-${{ runner.os }}-

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Setup Codex authentication
        run: |
          mkdir -p ~/.codex
          echo '${{ secrets.CODEX_AUTH }}' > ~/.codex/auth.json

      - name: Check Codex authentication update
        run: |
          cat ~/.codex/auth.json | jq -r '.last_refresh'

      - name: Checkout my-neovim-pluginlist
        uses: actions/checkout@v4
        with:
          repository: yutkat/my-neovim-pluginlist
          path: data/my-neovim-pluginlist
          ref: ai-${{ github.run_id }}
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Run RSS fetch script
        run: uv run scripts/fetch_rss.py data/latest_rss.json

      - name: Check RSS data
        run: cat data/latest_rss.json

      - name: Find correct category
        run: jq -r 'map(.title = "https://github.com/" + .title) | .[].title' data/latest_rss.json | tee data/my-neovim-pluginlist/.new_plugins.txt

      - name: Find and verify PR by branch
        run: |
          echo "Finding PR for branch: ai-${{ github.run_id }}"
          PR_URL=$(gh pr list --repo yutkat/my-neovim-pluginlist --head "ai-${{ github.run_id }}" --state open --limit 1 --json url --jq '.[0].url')

          if [ -n "$PR_URL" ]; then
            echo "Found PR: $PR_URL"
            cd data/my-neovim-pluginlist

            codex --ask-for-approval never exec --sandbox danger-full-access -m gpt-5-codex '
              Please analyze the markdown file ([a-z]*.md) in the current directory.
              This file contains Neovim plugins with their categories that were automatically added.

              ## Tasks
              1. Get a list of new plugins to add. Run `cat .new_plugins.txt`.
              2. Examine each plugin and their assigned categories.
                  2.1. Visit the corresponding repository on **GitHub**.
                  2.2. If any of the following items apply, remove the added plugins from the list.
                      - The plugin is a fork of another repository.
                      - It is a new colorscheme plugin.
                      - The repository has no README.
                      - The README is written in a language other than English.
                      - The repository is a Neovim configuration rather than a plugin.
                      - The repository is a sample plugin created solely for learning purposes.
              3. For each plugin, confirm and update if the category is appropriate.
                  3.1. From the README or other files, **infer which Neovim‑plugin category** the repository belongs to.
                  3.2. In `@.claude/SECTION.md`, consult the table of contents and locate the markdown file that contains that category.
                  3.3. Open that markdown file and insert the added plugin at the appropriate position.
                      - If no suitable section exists, create one first and then add the plugin.
                      - If there are subsections, review them and add the plugin to the **most appropriate subsection** whenever possible.
                      - Add new plugins at the bottom of the section.
                      - If there are related plugins, list them below the relevant plugin.
              4. Update the table with correct categories and provide clear reasons.
              5. Please write the selection reasons in following simple format without header |URL|Category|Reason| and save it as .pr-with-header2.md

              ## IMPORTANT
              - Do not ask for confirmation. This task is running on CI.
              - If you cannot specify a category, keep it as is.

              ## Input Repositories
              - .new_plugins.txt

              ## Output
              - UPDATE: [a-z]*.md
              - WROTE: .pr-with-header2.md

              Please make the necessary edits to improve categorization accuracy.
            '
          else
            echo "No PR found for branch: ai-${{ github.run_id }}"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Check if .pr-with-header2.md exists
        run: |
          if [ ! -f "data/my-neovim-pluginlist/.pr-with-header2.md" ]; then
            echo "data/my-neovim-pluginlist/.pr-with-header2.md does not exist. Processing completed."
            exit 1
          fi

      - name: Commit and push changes to my-neovim-pluginlist
        run: |
          cd data/my-neovim-pluginlist
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/yutkat/my-neovim-pluginlist.git
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git add .
            git commit -m "Add"
            git push origin ai-${{ github.run_id }}
            echo "Changes committed and pushed to branch ai-${{ github.run_id }}"
          fi
          gh pr create \
            --title "Add" \
            --body-file ".pr-with-header2.md" \
            --base main \
            --head ai-${{ github.run_id }} \
            --add-assignee yutkat
            --label "automated pr,bot"
          echo "PR body updated with new content"
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Create GitHub App token (this repository)
        if: always()
        id: app_token_self
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Refresh CODEX_AUTH secret from updated auth.json
        if: always()
        run: |
          gh secret set CODEX_AUTH -R "${{ github.repository }}" -b"$(cat ~/.codex/auth.json)"
        env:
          GH_TOKEN: ${{ steps.app_token_self.outputs.token }}
